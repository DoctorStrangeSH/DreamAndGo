name: Atlas Visual Preview
on:
  pull_request:
    paths:
      - 'design/atlas-preview.html'
      - 'css/**'
      - 'tests/atlas-visual.mjs'
      - '.github/workflows/atlas-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependency
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture desktop and mobile previews
        run: node tests/atlas-visual.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-design-screenshots
          path: atlas-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
