name: Checks

on:
  push:
    branches:
      - integration/v1.0-reconciliation
  pull_request:
    branches:
      - main
      - integration/v1.0-reconciliation

permissions:
  contents: read

concurrency:
  group: dreamandgo-checks-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependencies
        run: npm install --prefix server --no-package-lock --ignore-scripts

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('server/package.json') }}

      - name: Install Chromium headless shell for browser tests
        timeout-minutes: 8
        run: timeout 7m ./server/node_modules/.bin/playwright install chromium --only-shell

      - name: Run unit tests
        run: npm test

      - name: Run real-browser offline queue tests
        run: npm run test:browser

      - name: Run Firestore Emulator integration tests
        run: npx --yes firebase-tools@14.22.0 emulators:exec --only auth,firestore --project demo-dream-and-go "npm --prefix server run test:emulator"

      - name: Check JavaScript syntax
        run: npm run check
