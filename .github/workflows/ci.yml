name: CI

on:
  push:
    branches:
      - main
      - integration/v1.0-reconciliation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package.json

      - name: Install server test dependencies
        run: npm install --prefix server --no-package-lock --ignore-scripts

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run project and Chat V2 unit tests
        run: npm test
