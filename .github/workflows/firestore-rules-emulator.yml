name: Firestore Rules Emulator

on:
  push:
    branches:
      - refactor/security-foundation
  pull_request:
    paths:
      - "tests/firebase-emulator/**"
      - "tests/**"
      - "js/core/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/firestore-rules-emulator.yml"

permissions:
  contents: read

jobs:
  firestore-rules:
    name: Firestore Rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run root unit tests
        run: npm test

      - name: Run repository syntax checks
        run: npm run check

      - name: Install test dependencies
        working-directory: tests/firebase-emulator
        run: npm install --no-audit --no-fund

      - name: Run Firestore Rules Emulator suite
        run: npx --yes firebase-tools@latest emulators:exec --project demo-dreamandgo-collections-v1 --only firestore --config tests/firebase-emulator/firebase.json "npm --prefix tests/firebase-emulator test"
