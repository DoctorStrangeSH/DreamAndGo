name: Checks

on:
  push:
    branches:
      - integration/v1.0-reconciliation
  pull_request:
    branches:
      - main
      - integration/v1.0-reconciliation

permissions:
  contents: read

concurrency:
  group: dreamandgo-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check
