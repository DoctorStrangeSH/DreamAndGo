name: CI

on:
  push:
    branches:
      - main
      - integration/v1.0-reconciliation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server test dependencies
        run: npm install --prefix server --no-package-lock --ignore-scripts

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run project and Chat V2 unit tests
        run: npm test

  firestore-emulator:
    name: Firestore Emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install server test dependencies
        run: npm install --prefix server --no-package-lock --ignore-scripts

      - name: Run Firestore Emulator regression tests
        run: npx --yes firebase-tools@14.12.0 emulators:exec --only firestore,auth --project demo-dream-and-go "npm --prefix server run test:emulator"
