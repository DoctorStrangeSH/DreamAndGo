name: Firebase Emulator (candidate chat rules)
on:
  push:
    paths:
      - 'tests/firebase-emulator/**'
      - 'server/**'
      - '.github/workflows/firebase-emulator.yml'
  pull_request:
    paths:
      - 'tests/firebase-emulator/**'
      - '.github/workflows/firebase-emulator.yml'
jobs:
  chat-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/firebase-emulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator test dependencies
        run: npm install --no-audit --no-fund
      - name: Install candidate server dependencies
        run: npm install --prefix ../../server --no-audit --no-fund
      - name: Test isolated candidate rules (no deploy)
        run: npx -y firebase-tools@latest emulators:exec --project demo-dreamandgo-chat-rules --only firestore --config firebase.json "npm test"
      - name: Test candidate server transactions against Firestore Emulator
        run: npx -y firebase-tools@latest emulators:exec --project demo-dreamandgo-chat-rules --only firestore --config firebase.json "node --test ../../server/chat-transactions.emulator.test.mjs"
      - name: Test interrupted migration rehearsal on isolated emulator
        run: npx -y firebase-tools@latest emulators:exec --project demo-dreamandgo-chat-rules --only firestore --config firebase.json "node --test ../../server/migration-rehearsal.emulator.test.mjs"
      - name: Test isolated backup restore rehearsal
        run: npx -y firebase-tools@latest emulators:exec --project demo-dreamandgo-chat-rules --only firestore --config firebase.json "node --test ../../server/backup-restore-rehearsal.emulator.test.mjs"
      - name: Test chat send versus write-freeze race
        run: npx -y firebase-tools@latest emulators:exec --project demo-dreamandgo-chat-rules --only firestore --config firebase.json "node --test ../../server/chat-cutover-race.emulator.test.mjs"
